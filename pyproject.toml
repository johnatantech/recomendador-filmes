[project]
name = "recomendador"
version = "0.1.0"
description = "Comparação de abordagens de recomendação de filmes com MovieLens"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
app = ["streamlit>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
